<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<meta name="theme-color" content="#101823">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>C1 Clearance — Lead Centre · stato.tech concept</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,600;0,700;0,800;1,800&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@0,400;0,500;0,600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#080C12;--ink2:#101823;--ink3:#1B2432;--ink4:#232D3C;
  --volt:#1477E6;--volt-d:#0E5DB8;--volt-lo:#E7F1FD;--glow:#63C9FF;
  --wa:#25A566;--wa-lo:#E6F6EE;
  --paper:#F4F7FA;--white:#fff;--hair:#E2E8EF;--hair2:#EDF1F6;
  --steel:#5D6E82;--steel2:#8A9AAD;
  --amber:#B4720A;--amber-lo:#FDF3E2;--red:#C0392B;--red-lo:#FCEDEB;--go:#1D8A5C;--go-lo:#E7F5EE;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
  --sans:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --disp:"Archivo",Arial,sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
  --topbar:56px;--banner:30px;--chips:0px;--bottombar:0px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{overscroll-behavior-y:none}
body{
  margin:0;background:var(--paper);font-family:var(--sans);color:var(--ink);font-size:14px;
  -webkit-font-smoothing:antialiased;text-size-adjust:100%;
}
body.sheet-open{overflow:hidden}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit;text-align:left}
input,textarea{font:inherit;-webkit-appearance:none}
:focus-visible{outline:2px solid var(--glow);outline-offset:2px}

/* ---------- concept banner ---------- */
.banner{
  background:var(--ink);color:var(--steel2);padding:calc(8px + var(--safe-t)) 16px 8px;
  font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  display:flex;gap:12px;justify-content:space-between;align-items:center;border-bottom:1px solid var(--ink4);
}
.banner b{color:var(--glow);font-weight:600}
.banner .hide-sm{white-space:nowrap}

/* ---------- top bar ---------- */
.topbar{
  background:var(--ink2);color:#fff;display:flex;align-items:center;gap:14px;
  padding:0 14px;height:var(--topbar);position:relative;overflow:hidden;
}
.topbar:before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(112deg,transparent 58%,rgba(20,119,230,.35) 74%,transparent 76%),
             linear-gradient(112deg,transparent 66%,rgba(99,201,255,.2) 82%,transparent 84%);
}
.brand{
  font-family:var(--disp);font-weight:800;font-style:italic;text-transform:uppercase;
  font-size:17px;letter-spacing:-.01em;position:relative;white-space:nowrap;
}
.brand span{color:var(--glow)}
.search{flex:1;max-width:420px;position:relative;min-width:0}
.search input{
  width:100%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:#fff;
  border-radius:6px;padding:9px 12px 9px 32px;font-size:13px;outline:none;
}
.search input::placeholder{color:#7B8CA0}
.search input:focus{border-color:var(--glow);background:rgba(255,255,255,.13)}
.search svg{position:absolute;left:10px;top:10px;opacity:.55;pointer-events:none}
.topright{margin-left:auto;display:flex;align-items:center;gap:10px;position:relative}
.sla{
  font-family:var(--mono);font-size:11px;background:rgba(192,57,43,.2);color:#FF9A8D;
  padding:5px 9px;border-radius:4px;letter-spacing:.04em;white-space:nowrap;
}
.avatar{
  width:32px;height:32px;border-radius:50%;background:var(--volt);display:grid;place-items:center;
  font-family:var(--mono);font-size:11px;font-weight:600;flex:0 0 auto;
}

/* ---------- chips (mobile filter row) ---------- */
.chips{display:none}

/* ---------- layout ---------- */
.shell{
  display:grid;grid-template-columns:216px minmax(280px,340px) 1fr 302px;
  height:calc(100dvh - var(--topbar) - var(--banner));min-height:560px;
}
.col{overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--white);border-right:1px solid var(--hair)}
.col:last-child{border-right:0}

/* ---------- rail ---------- */
.rail{background:var(--ink);color:#B8C6D5;padding:14px 0}
.rlabel{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;
  color:#5D6E82;padding:0 16px;margin:0 0 9px;
}
.rail hr{border:0;border-top:1px solid var(--ink4);margin:16px 0}
.chan{display:flex;align-items:center;gap:10px;padding:10px 16px;width:100%;font-size:13.5px;border-left:2px solid transparent}
.chan:hover{background:rgba(255,255,255,.05)}
.chan[aria-current="true"]{background:rgba(20,119,230,.16);border-left-color:var(--glow);color:#fff;font-weight:500}
.dot{
  width:22px;height:22px;border-radius:5px;display:grid;place-items:center;
  font-family:var(--mono);font-size:10px;font-weight:600;color:#fff;flex:0 0 auto;
}
.cnt{margin-left:auto;font-family:var(--mono);font-size:11px;color:#7B8CA0}
.chan[aria-current="true"] .cnt{color:var(--glow)}

/* ---------- list ---------- */
.listhead{
  padding:13px 16px;border-bottom:1px solid var(--hair);display:flex;align-items:center;gap:8px;
  position:sticky;top:0;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);z-index:3;
}
.listhead h2{font-family:var(--disp);font-weight:700;font-size:14px;text-transform:uppercase;letter-spacing:.02em;margin:0}
.listhead .cnt2{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--steel2);white-space:nowrap}
.lead{display:block;width:100%;padding:14px 16px;border-bottom:1px solid var(--hair2);border-left:3px solid transparent}
.lead:active{background:var(--hair2)}
@media (hover:hover){.lead:hover{background:var(--paper)}}
.lead[aria-current="true"]{background:var(--volt-lo);border-left-color:var(--volt)}
.lrow1{display:flex;align-items:center;gap:8px;margin-bottom:3px}
.lname{font-weight:600;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lwhen{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--steel2);white-space:nowrap;flex:0 0 auto}
.lprev{color:var(--steel);font-size:12.5px;line-height:1.45;margin:0 0 8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tags{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.tag{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;
  padding:3px 6px;border-radius:3px;background:var(--hair2);color:var(--steel);white-space:nowrap;
}
.tag.wa{background:var(--wa-lo);color:var(--wa)}
.tag.ph{background:var(--volt-lo);color:var(--volt-d)}
.tag.em{background:#F2EDFB;color:#6B4CA8}
.tag.fm{background:var(--amber-lo);color:var(--amber)}
.tag.qr{background:var(--ink);color:var(--glow)}
.tag.hot{background:var(--red-lo);color:var(--red)}
.unread{width:7px;height:7px;border-radius:50%;background:var(--volt);flex:0 0 auto}
.pics{display:flex;gap:3px;margin-top:8px}
.pics i{width:28px;height:28px;border-radius:3px;background:linear-gradient(135deg,#C6D2DF,#93A5B8);display:block}
.pics i:nth-child(2){background:linear-gradient(135deg,#D6CFC4,#A79A87)}
.pics i:nth-child(3){background:linear-gradient(135deg,#C3D0C6,#8CA292)}
.pics i:nth-child(4){background:linear-gradient(135deg,#D2C8D4,#9C8FA3)}

/* ---------- thread ---------- */
.thread{background:var(--paper);display:flex;flex-direction:column;overflow:hidden;min-width:0}
.thead{
  background:var(--white);border-bottom:1px solid var(--hair);padding:11px 16px;
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;flex:0 0 auto;
}
.back{display:none;width:34px;height:34px;border-radius:8px;place-items:center;flex:0 0 auto;margin-left:-6px}
.back:active{background:var(--hair2)}
.tnames{min-width:0;flex:1}
.thead h2{font-family:var(--disp);font-weight:700;font-size:16.5px;margin:0;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tmeta{font-family:var(--mono);font-size:10.5px;color:var(--steel);margin:3px 0 0;line-height:1.5}
.tacts{display:flex;gap:6px;margin-left:auto;flex:0 0 auto}
.ib{width:36px;height:36px;border-radius:7px;border:1px solid var(--hair);display:grid;place-items:center;background:var(--white)}
.ib:active{background:var(--hair2)}
@media (hover:hover){.ib:hover{border-color:var(--volt);color:var(--volt)}}
.ib.pri{background:var(--go);border-color:var(--go);color:#fff}
.ib.sheetbtn{display:none}
.tbody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:18px 16px;min-height:0}
.daysep{text-align:center;font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--steel2);margin:22px 0 16px;position:relative}
.daysep:first-child{margin-top:0}
.daysep:before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:var(--hair)}
.daysep span{background:var(--paper);padding:0 12px;position:relative}
.msg{max-width:76%;margin-bottom:16px}
.msg.out{margin-left:auto}
.mchan{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--steel2);margin:0 0 5px}
.msg.out .mchan{text-align:right}
.bub{background:var(--white);border:1px solid var(--hair);border-radius:3px 12px 12px 12px;padding:11px 14px;line-height:1.55;font-size:14px;overflow-wrap:break-word}
.msg.out .bub{background:var(--volt);border-color:var(--volt);color:#fff;border-radius:12px 3px 12px 12px}
.mtime{font-family:var(--mono);font-size:10px;color:var(--steel2);margin:5px 0 0}
.msg.out .mtime{text-align:right}
.photogrid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:9px}
.photogrid i{aspect-ratio:1;border-radius:4px;background:linear-gradient(135deg,#CBD6E2,#8FA2B6)}
.photogrid i:nth-child(2){background:linear-gradient(135deg,#D6CFC4,#A79A87)}
.photogrid i:nth-child(3){background:linear-gradient(135deg,#C3D0C6,#8CA292)}
.photogrid i:nth-child(4){background:linear-gradient(135deg,#D2C8D4,#9C8FA3)}

.callev{background:var(--white);border:1px solid var(--hair);border-left:3px solid var(--volt);border-radius:0 8px 8px 0;padding:14px;margin-bottom:16px}
.cehead{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;margin:0 0 10px;flex-wrap:wrap}
.cehead .dur{font-family:var(--mono);font-size:11px;color:var(--steel);font-weight:400;margin-left:auto}
.player{display:flex;align-items:center;gap:10px;background:var(--paper);border-radius:6px;padding:9px 11px}
.play{width:30px;height:30px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;flex:0 0 auto}
.play[data-on="1"]{background:var(--volt)}
.wavef{flex:1;display:flex;align-items:center;gap:1.5px;height:24px;min-width:0}
.wavef b{flex:1;background:var(--steel2);border-radius:1px;display:block;transition:background .2s}
.wavef b.on{background:var(--volt)}
.ptime{font-family:var(--mono);font-size:10.5px;color:var(--steel);white-space:nowrap}
.ai{background:var(--ink);color:#C3D0DE;border-radius:8px;padding:14px;margin-top:10px;font-size:12.5px;line-height:1.6}
.ai p{margin:0 0 8px}
.aihead{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--glow);margin-bottom:8px}
.ai ul{margin:0;padding-left:16px}
.ai li{margin:4px 0}
.ai li::marker{color:var(--glow)}
.extract{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.ex{font-family:var(--mono);font-size:10px;background:rgba(99,201,255,.12);color:var(--glow);padding:4px 7px;border-radius:3px;letter-spacing:.04em}
.sysev{
  font-family:var(--mono);font-size:10.5px;color:var(--steel);letter-spacing:.04em;margin:0 auto 16px;
  background:var(--white);border:1px dashed var(--hair);border-radius:20px;padding:7px 14px;
  display:table;text-align:center;max-width:100%;
}

.composer{background:var(--white);border-top:1px solid var(--hair);padding:10px 16px calc(12px + var(--safe-b));flex:0 0 auto}
.ctabs{display:flex;gap:5px;margin-bottom:9px;align-items:center;overflow-x:auto;scrollbar-width:none}
.ctabs::-webkit-scrollbar{display:none}
.ctab{
  font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;
  padding:6px 9px;border-radius:5px;color:var(--steel);border:1px solid var(--hair);white-space:nowrap;
}
.ctab[aria-selected="true"]{background:var(--wa-lo);border-color:#BFE6D2;color:var(--wa);font-weight:600}
.freefree{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--steel2);white-space:nowrap;padding-left:8px}
.crow{display:flex;gap:9px;align-items:flex-end}
.crow textarea{
  flex:1;border:1px solid var(--hair);border-radius:8px;padding:11px 12px;font-size:14px;
  resize:none;height:44px;max-height:120px;outline:none;line-height:1.4;min-width:0;
}
.crow textarea:focus{border-color:var(--volt)}
.send{width:44px;height:44px;border-radius:8px;background:var(--volt);color:#fff;display:grid;place-items:center;flex:0 0 auto}
.send:active{background:var(--volt-d)}

/* ---------- detail ---------- */
.detail{padding:0}
.handle{display:none}
.dsec{padding:16px;border-bottom:1px solid var(--hair)}
.dlabel{font-family:var(--mono);font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--steel2);margin:0 0 11px}
.dcust{text-align:center;padding-top:20px}
.dav{width:54px;height:54px;border-radius:50%;background:var(--ink);color:var(--glow);display:grid;place-items:center;margin:0 auto 10px;font-family:var(--disp);font-weight:800;font-size:18px}
.dcust h3{font-family:var(--disp);font-weight:700;font-size:16px;margin:0 0 3px}
.dcust p{font-family:var(--mono);font-size:11px;color:var(--steel);margin:0}
.dchips{display:flex;gap:5px;justify-content:center;margin-top:10px;flex-wrap:wrap}
.frow{display:flex;gap:10px;padding:8px 0;font-size:13.5px;align-items:flex-start}
.frow em{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--steel2);font-style:normal;width:76px;flex:0 0 auto;padding-top:2px}
.frow b{font-weight:500}
.attr{background:var(--ink);border-radius:8px;padding:14px;color:#C3D0DE}
.attr .dlabel{color:var(--glow);margin-bottom:9px}
.attrbig{font-family:var(--disp);font-weight:800;font-size:15px;color:#fff;margin:0 0 4px;text-transform:uppercase;letter-spacing:-.01em}
.attr p{margin:0;font-size:11.5px;line-height:1.55}
.attrnum{font-family:var(--mono);font-size:10.5px;color:var(--glow);margin-top:9px;padding-top:9px;border-top:1px solid var(--ink4)}
.pipe{list-style:none;padding:0;margin:0}
.pipe li{display:flex;gap:11px;align-items:flex-start;position:relative;padding-bottom:15px}
.pipe li:last-child{padding-bottom:0}
.pipe li:not(:last-child):before{content:"";position:absolute;left:9px;top:21px;bottom:2px;width:1.5px;background:var(--hair)}
.pipe li.done:not(:last-child):before{background:var(--go)}
.pnode{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--hair);background:var(--white);display:grid;place-items:center;font-family:var(--mono);font-size:9px;color:var(--steel2);flex:0 0 auto;z-index:1}
.pipe li.done .pnode{background:var(--go);border-color:var(--go);color:#fff}
.pipe li.now .pnode{background:var(--volt);border-color:var(--volt);color:#fff;box-shadow:0 0 0 3px var(--volt-lo)}
.ptxt{font-size:13.5px;padding-top:1px}
.pipe li.now .ptxt{font-weight:600;color:var(--volt)}
.pipe li:not(.done):not(.now) .ptxt{color:var(--steel2)}
.ptxt small{display:block;font-family:var(--mono);font-size:10px;color:var(--steel2);font-weight:400;margin-top:1px}
.quote{background:var(--go-lo);border:1px solid #C4E3D2;border-radius:8px;padding:14px}
.qfig{font-family:var(--disp);font-weight:800;font-size:26px;color:var(--go);letter-spacing:-.02em;margin:2px 0 3px}
.quote p{margin:0;font-size:11.5px;color:#2F6B51;line-height:1.5}
.btn{display:block;width:100%;text-align:center;background:var(--ink);color:#fff;border-radius:7px;padding:12px;font-size:13px;font-weight:500;margin-top:10px}
.btn:active{background:var(--volt)}
.btn.ghost{background:none;color:var(--steel);border:1px solid var(--hair)}
.btn.ghost:active{border-color:var(--volt);color:var(--volt)}
.empty{display:grid;place-items:center;padding:56px 30px;text-align:center;color:var(--steel2)}
.empty p{max-width:30ch;line-height:1.6;font-size:13.5px}

/* ---------- toast ---------- */
.toast{
  position:fixed;left:50%;bottom:calc(24px + var(--safe-b));transform:translate(-50%,140%);
  background:var(--ink);color:#fff;font-size:13px;padding:11px 18px;border-radius:24px;z-index:200;
  transition:transform .3s cubic-bezier(.2,.9,.3,1);box-shadow:0 8px 30px rgba(8,12,18,.3);max-width:88vw;
}
.toast.up{transform:translate(-50%,0)}

.backdrop{
  position:fixed;inset:0;background:rgba(8,12,18,.5);z-index:65;opacity:0;pointer-events:none;
  transition:opacity .25s;backdrop-filter:blur(2px);
}
body.sheet-open .backdrop{opacity:1;pointer-events:auto}
.bottombar{display:none}

/* ================= TABLET ================= */
@media (max-width:1180px){
  .shell{grid-template-columns:190px minmax(250px,320px) 1fr}
  .detail{display:none}
  .ib.sheetbtn{display:grid}
  .detail{
    position:fixed;right:0;top:0;bottom:0;width:min(340px,88vw);z-index:70;display:block;
    transform:translateX(101%);transition:transform .28s cubic-bezier(.2,.9,.3,1);
    box-shadow:-8px 0 40px rgba(8,12,18,.22);overflow-y:auto;border-left:1px solid var(--hair);
  }
  body.sheet-open .detail{transform:none}
}

/* ================= MOBILE ================= */
@media (max-width:860px){
  :root{--topbar:52px;--bottombar:60px}
  .banner{font-size:9px;letter-spacing:.1em;padding:calc(7px + var(--safe-t)) 12px 7px}
  .banner .hide-sm{display:none}
  .topbar{gap:10px;padding:0 12px}
  .brand{font-size:15.5px}
  .topbar .search{display:none}
  .sla{font-size:10px;padding:4px 8px}

  /* mobile filter chips */
  .chips{
    display:flex;gap:6px;overflow-x:auto;padding:10px 12px;background:var(--ink);
    border-bottom:1px solid var(--ink4);scrollbar-width:none;
  }
  .chips::-webkit-scrollbar{display:none}
  .chip{
    display:flex;align-items:center;gap:6px;flex:0 0 auto;padding:8px 12px;border-radius:20px;
    background:rgba(255,255,255,.07);color:#B8C6D5;font-size:12.5px;white-space:nowrap;
    border:1px solid rgba(255,255,255,.1);
  }
  .chip[aria-current="true"]{background:var(--volt);border-color:var(--volt);color:#fff;font-weight:500}
  .chip b{font-family:var(--mono);font-size:10.5px;font-weight:600;opacity:.75}

  /* mobile search row */
  .msearch{display:block;padding:10px 12px;background:var(--ink);border-bottom:1px solid var(--ink4)}
  .msearch .search{max-width:none;display:block}

  .shell{display:block;height:auto;min-height:0}
  .rail{display:none}
  .col{border-right:0;overflow:visible}

  /* list is the home screen */
  #listcol{display:block;padding-bottom:calc(var(--bottombar) + var(--safe-b) + 8px);background:var(--white);min-height:60dvh}
  body[data-view="thread"] #listcol{display:none}
  .listhead{padding:14px 14px 12px}
  .lead{padding:15px 14px}
  .lead[aria-current="true"]{background:var(--white);border-left-color:transparent}
  .lname{font-size:14.5px}
  .lprev{font-size:13px}

  /* thread becomes a full screen */
  .thread{display:none}
  body[data-view="thread"] .thread{
    display:flex;position:fixed;inset:0;z-index:60;height:100dvh;
    padding-top:var(--safe-t);background:var(--paper);
  }
  .back{display:grid}
  .thead{padding:10px 12px}
  .thead h2{font-size:16px}
  .tacts{gap:5px}
  .ib{width:38px;height:38px}
  .tbody{padding:16px 14px}
  .msg{max-width:88%}

}

function match(l,k){
  if(k==='all')return true;
  if(k==='unanswered')return l.unread&&l.stage<2;
  if(k==='quote')return l.stage===2;
  if(k==='booked')return l.stage>=3;
  if(['van','meta','google'].includes(k))return l.src===k;
  return l.ch===k;
}
function visible(){
  let r=LEADS.filter(l=>match(l,filter));
  if(term){
    const t=term.toLowerCase();
    r=r.filter(l=>(l.name+' '+l.prev+' '+l.job+' '+l.addr+' '+l.phone+' '+l.fields.map(f=>f[1]).join(' ')).toLowerCase().includes(t));
  }
  return r;
}
const count=k=>LEADS.filter(l=>match(l,k)).length;

  });

  document.getElementById('chips').innerHTML=VIEWS.map(v=>
    `<button class="chip" data-ch="${v.k}" aria-current="${v.k===filter}">${v.label} <b>${count(v.k)}</b></button>`).join('');

}

        ?`<div class="quote"><p class="dlabel" style="color:#2F6B51;margin-bottom:2px">Quoted</p>
           <p class="qfig">${esc(l.quote)}</p>
           <p>Priced from ${l.photos?l.photos+' photos':'the call'} · disposal included</p></div>`
        :`<div class="quote" style="background:var(--amber-lo);border-color:#EED9B2">
           <p class="dlabel" style="color:var(--amber);margin-bottom:2px">No price sent yet</p>
           <p class="qfig" style="color:var(--amber)">—</p>
           <p style="color:#8A5A08">${l.photos?'Photos are in. Price it and send.':'Not enough detail. Ask for photos.'}</p></div>`}
      <button class="btn" data-act="quote">Send quote on WhatsApp</button>
      <button class="btn ghost" data-act="sheetjob">Open job sheet for the crew</button>
    </div>`;
}

function render(){renderNav();renderList();renderThread();renderDetail()}

/* ---------------- interaction ---------------- */
let toastT;
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('up');
  clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('up'),2200);
}
function openSheet(){document.body.classList.add('sheet-open');document.getElementById('detail').setAttribute('aria-hidden','false')}
function closeSheet(){document.body.classList.remove('sheet-open');document.getElementById('detail').setAttribute('aria-hidden',isTablet()?'true':'false')}
function showThread(push){
  if(!isMobile())return;
  document.body.dataset.view='thread';
  if(push!==false&&location.hash!=='#thread')history.pushState({v:'thread'},'','#thread');
}
function showList(){
  document.body.dataset.view='list';
  closeSheet();
}

document.addEventListener('click',e=>{
  const t=e.target;

  if(t.closest('[data-back]')){ if(location.hash==='#thread'){history.back()}else{showList()} return }
  if(t.closest('[data-sheet]')){ openSheet(); return }
  if(t.closest('#backdrop')){ closeSheet(); return }
  if(t.closest('.handle')){ closeSheet(); return }

  const lead=t.closest('.lead');
  if(lead){
    active=lead.dataset.id;
    const l=LEADS.find(x=>x.id===active); if(l){l.unread=false;l.hot=false}
    render(); showThread(); return;
  }

  const nav=t.closest('.chan,.chip,.nav');
  if(nav){
    filter=nav.dataset.ch;
    const rows=visible();
    if(rows.length&&!rows.find(r=>r.id===active))active=rows[0].id;
    render();
    if(!isMobile()&&document.body.dataset.view==='thread')showList();
    const lc=document.getElementById('listcol'); if(lc)lc.scrollTop=0;
    return;
  }

  const play=t.closest('[data-play]');
  if(play){
    const on=play.dataset.on==='1';
    play.dataset.on=on?'0':'1';
    play.innerHTML=on?'<svg width="9" height="10" viewBox="0 0 10 12" fill="#fff"><path d="M0 0l10 6-10 6z"/></svg>'
                     :'<svg width="9" height="10" viewBox="0 0 10 12" fill="#fff"><rect width="3.4" height="12"/><rect x="6.6" width="3.4" height="12"/></svg>';
    toast(on?'Recording paused':'Playing recording · 6 min 12 sec');
    return;
  }

  const ctab=t.closest('.ctab');
  if(ctab){
    ctab.parentElement.querySelectorAll('.ctab').forEach(c=>c.setAttribute('aria-selected','false'));
    ctab.setAttribute('aria-selected','true');
    return;
  }

  if(t.closest('[data-send]')){ send(); return }

  const act=t.closest('[data-act]');
  if(act){
    const l=LEADS.find(x=>x.id===active), a=act.dataset.act;
    if(a==='book'){ if(l.stage<3){l.stage=3} render(); toast('Job booked — added to the crew sheet'); }
    if(a==='call'){ toast('Dialling '+l.phone+' from 0330 133 9144'); }
    if(a==='quote'){ toast(l.quote!=='—'?'Quote '+l.quote+' sent on WhatsApp':'Price it first, then send'); }
    if(a==='sheetjob'){ toast('Job sheet opened — photos, postcode and access notes attached'); }
    return;
  }
});

function send(){
  const box=document.getElementById('msg'); if(!box)return;
  const v=box.value.trim(); if(!v)return;
  const l=LEADS.find(x=>x.id===active);
  const now=new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
  const chan=l.ch==='em'?'Replied via email · Penda':'Replied via WhatsApp · Penda';
  l.timeline.push({t:'out',ch:chan,time:now,body:v});
  if(l.stage<1)l.stage=1;
  l.prev='You: '+v; l.when='now'; l.unread=false; l.hot=false;
  box.value=''; box.style.height='44px';
  render(); toast('Sent — logged against the lead');
}

document.addEventListener('input',e=>{
  if(e.target.id==='q'||e.target.id==='qm'){
    term=e.target.value;
    const other=document.getElementById(e.target.id==='q'?'qm':'q');
    if(other)other.value=term;
    renderList();
  }
  if(e.target.id==='msg'){
    e.target.style.height='44px';
    e.target.style.height=Math.min(e.target.scrollHeight,120)+'px';
  }
});

document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){ if(document.body.classList.contains('sheet-open'))closeSheet(); else if(isMobile()&&document.body.dataset.view==='thread')showList() }
  if(e.key==='Enter'&&!e.shiftKey&&e.target.id==='msg'){ e.preventDefault(); send() }
});

window.addEventListener('popstate',()=>{ if(location.hash!=='#thread')showList() });
window.addEventListener('resize',()=>{
  if(!isMobile()&&document.body.dataset.view==='thread')document.body.dataset.view='list';
  if(!isTablet())closeSheet();
});

if(location.hash==='#thread')history.replaceState(null,'','#');
render();
</script>
</body>
</html>
